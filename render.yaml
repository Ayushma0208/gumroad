# Lumen on Render: Postgres + Express API + Next.js web.
# Apply from the dashboard: New → Blueprint, then connect this GitHub repo.
#
# After the first sync, open the API service → Environment and paste
# Cloudinary + Razorpay secrets (sync: false). The API will not boot without them.

databases:
  - name: lumen-db
    region: oregon
    plan: basic-256mb
    databaseName: lumen
    user: lumen
    postgresMajorVersion: "16"

services:
  - type: web
    name: lumen-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @lumen/api build
    startCommand: pnpm --filter @lumen/api prisma:deploy && pnpm --filter @lumen/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumen-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: lumen_session
      - key: COOKIE_SAME_SITE
        value: lax
      - key: CLIENT_URL
        fromService:
          type: web
          name: lumen-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_URL
        fromService:
          type: web
          name: lumen-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_FROM
        value: Lumen <noreply@example.com>
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: lumen-web
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @lumen/web build
    startCommand: pnpm --filter @lumen/web start -- --hostname 0.0.0.0
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      - key: NEXT_PUBLIC_USE_REMOTE_API
        value: "true"
      - key: API_PROXY_TARGET
        fromService:
          type: web
          name: lumen-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: lumen-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: lumen-web
          envVarKey: RENDER_EXTERNAL_URL
