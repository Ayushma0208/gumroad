# Optional. Prefer + New → Web Service (Free) — see docs/DEPLOYMENT.md.
# Blueprint is not required. This file uses only Render Free compute so it
# should not prompt for a card. Free Postgres expires after 30 days.

databases:
  - name: lumen-db
    region: oregon
    plan: free
    databaseName: lumen
    user: lumen
    postgresMajorVersion: "16"

services:
  - type: web
    name: lumen-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @lumen/api build
    startCommand: pnpm --filter @lumen/api prisma:deploy && pnpm --filter @lumen/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumen-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: lumen_session
      - key: COOKIE_SAME_SITE
        value: lax
      - key: CLIENT_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_FROM
        value: Lumen <noreply@example.com>
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: lumen-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @lumen/web build
    startCommand: pnpm --filter @lumen/web start -- --hostname 0.0.0.0
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: NEXT_PUBLIC_USE_REMOTE_API
        value: "true"
      - key: API_PROXY_TARGET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
